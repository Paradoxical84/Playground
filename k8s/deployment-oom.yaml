# Failure-injection overlay: OOMKilled
#
# resources.limits.memory is set to 128 Mi.  TensorFlow CPU needs
# ≈ 300–500 Mi just for `import tensorflow`, so the kernel OOM killer
# sends SIGKILL (exit code 137) before the process finishes starting.
#
# Unlike a probe failure (where kubelet kills the container), here the
# *kernel* kills the process because cgroup memory usage exceeded the
# hard limit.  Kubernetes surfaces this as reason "OOMKilled".
#
# Apply:  kubectl apply -f k8s/deployment-oom.yaml
# Watch:  kubectl get pods -n ai-lab -l scenario=oom -w
# Clean:  kubectl delete -f k8s/deployment-oom.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-lab-oom
  namespace: ai-lab
  labels:
    app: ai-lab-oom
    scenario: oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-lab-oom
  template:
    metadata:
      labels:
        app: ai-lab-oom
        scenario: oom
    spec:
      containers:
        - name: ai-lab
          image: ai-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_DIR
              value: /model
            - name: PORT
              value: "8080"
            - name: STARTUP_DELAY_SEC
              value: "0"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
