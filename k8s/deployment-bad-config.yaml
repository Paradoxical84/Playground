# Failure-injection overlay: Configuration Error (wrong MODEL_DIR)
#
# MODEL_DIR is set to /wrong_model_path, which does not exist inside the
# container.  The app logs a clear error, but Flask starts normally, so
# /healthz returns 200 (liveness passes) while /readyz returns 503
# forever (readiness never passes).
#
# The pod stays Running 0/1 Ready with zero restarts — the subtlest
# failure mode.  No traffic is routed because the Service only sends to
# Ready endpoints.
#
# Apply:  kubectl apply -f k8s/deployment-bad-config.yaml
# Watch:  kubectl get pods -n ai-lab -l scenario=bad-config -w
# Clean:  kubectl delete -f k8s/deployment-bad-config.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-lab-bad-config
  namespace: ai-lab
  labels:
    app: ai-lab-bad-config
    scenario: bad-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-lab-bad-config
  template:
    metadata:
      labels:
        app: ai-lab-bad-config
        scenario: bad-config
    spec:
      containers:
        - name: ai-lab
          image: ai-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_DIR
              value: /wrong_model_path
            - name: PORT
              value: "8080"
            - name: STARTUP_DELAY_SEC
              value: "0"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
