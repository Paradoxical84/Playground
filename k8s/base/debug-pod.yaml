apiVersion: v1
kind: Pod
metadata:
  name: debug-shell
  namespace: ai-lab
  labels:
    app: debug-shell
spec:
  restartPolicy: Always
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
