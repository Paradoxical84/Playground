apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-lab
  namespace: ai-lab
  labels:
    app: ai-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-lab
  template:
    metadata:
      labels:
        app: ai-lab
    spec:
      containers:
        - name: ai-lab
          image: ai-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_DIR
              value: /app/model
            - name: PORT
              value: "8080"
            - name: STARTUP_DELAY
              value: "0"
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
