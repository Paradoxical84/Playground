# Failure scenario 2: OOMKilled via tight memory limit
#
# TensorFlow + the model easily need >256 Mi. Setting the limit to 64 Mi
# causes the kernel OOM killer to terminate the container.
#
# Symptoms: Pod shows OOMKilled status, restarts climb.
# Fix: Increase memory limits (or profile actual usage first).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-lab-oom
  namespace: ai-lab
  labels:
    app: ai-lab-oom
    scenario: oom-killed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-lab-oom
  template:
    metadata:
      labels:
        app: ai-lab-oom
        scenario: oom-killed
    spec:
      containers:
        - name: ai-lab
          image: ai-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_DIR
              value: /model
            - name: PORT
              value: "8080"
            - name: STARTUP_DELAY_SEC
              value: "0"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
